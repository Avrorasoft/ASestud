<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Regencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="bg-warning text-dark text-center py-4">
            <i class="bi bi-shield-lock-fill" style="font-size: 3rem;"></i>
            <h3 class="fw-bold mt-2 mb-0 text-uppercase">Área de Regencia</h3>
            <small>Control de Asistencia Institucional</small>
        </div>
        
        <div class="p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} text-center fw-bold">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('regente.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="mb-4">
                    <label class="form-label text-info fw-bold"><i class="bi bi-key-fill"></i> Contraseña de Acceso:</label>
                    <input type="password" name="password" class="form-control bg-dark text-light border-secondary text-center fs-4" placeholder="••••••••" required autofocus>
                </div>
                
                <button type="submit" class="btn btn-warning w-100 fw-bold fs-5 shadow text-dark">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Turno
                </button>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
