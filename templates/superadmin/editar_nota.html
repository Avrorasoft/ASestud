{% extends "base.html" %}
{% block title %}Editar Calificación - Colegio Dr. Antonio Vaca Díez{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-journal-check me-2"></i>Editar Calificación</h4>
                </div>
                <div class="card-body text-dark">
                    <!-- Formulario de edición -->
                    <form method="POST">
                        <!-- Campo oculto para mantener la sesión de superadmin activa -->
                        <input type="hidden" name="superadmin_pass" value="{{ request.args.get('pass', '') }}">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Evaluación (Ej. 1er Trimestre, Final)</label>
                            <input type="text" class="form-control" name="tipo" value="{{ nota.tipo }}" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Nota Registrada</label>
                            <input type="number" step="0.1" min="0" max="100" class="form-control" name="nota" value="{{ nota.nota }}" required>
                            <div class="form-text">La nota debe estar en un rango de 0 a 100.</div>
                        </div>
                        
                        <hr>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('estudiantes.ver_estudiante', id=nota.estudiante_id) }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left-circle me-1"></i> Cancelar y Volver
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-save-fill me-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
