<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra Escolar de Tareas - Acceso Tutores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f0f2f5; font-family: system-ui, -apple-system, sans-serif; }
        .card-login { max-width: 420px; border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
    <div class="container">
        <div class="card card-login mx-auto p-4 bg-white">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-grid-3x3-gap-fill fs-2"></i>
                </div>
                <h4 class="fw-bold mb-1 text-dark">Pizarra de Tareas</h4>
                <p class="text-muted small">Seguimiento Pedagógico de Estudiantes</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} py-2 small rounded-3 mb-3">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">C.I. o Código RUDE del Estudiante</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                        <input type="text" name="ci_rude" class="form-control" placeholder="Ingrese el C.I. o RUDE" required autofocus>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3">
                    <i class="bi bi-door-open me-1"></i> Abrir Pizarra
                </button>
            </form>
        </div>
    </div>
</body>
</html>
