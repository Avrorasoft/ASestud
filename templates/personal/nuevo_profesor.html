{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Nuevo Profesor</h4>
                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellidos *</label>
                                <input type="text"
                                       name="apellidos"
                                       class="form-control"
                                       value="{{ request.form.get('apellidos', '') }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombres *</label>
                                <input type="text"
                                       name="nombres"
                                       class="form-control"
                                       value="{{ request.form.get('nombres', '') }}"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">CI</label>
                                <input type="text"
                                       name="ci"
                                       class="form-control"
                                       value="{{ request.form.get('ci', '') }}">
                            </div>

                            <div class="col-md-8 mb-3">
                                <label class="form-label">Especialidad</label>
                                <input type="text"
                                       name="especialidad"
                                       class="form-control"
                                       value="{{ request.form.get('especialidad', '') }}"
                                       placeholder="Ejemplo: Matemáticas, Comunicación, Educación Física">
                            </div>

                            <!-- ⭐ NUEVO: NIVEL QUE ATIENDE -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Nivel que atiende</label>
                                <select name="nivel" class="form-select">
                                    <option value="">-- Sin asignar --</option>
                                    <option value="Nidito"
                                        {% if request.form.get('nivel') == 'Nidito' %}selected{% endif %}>
                                        Nidito
                                    </option>
                                    <option value="Primaria"
                                        {% if request.form.get('nivel') == 'Primaria' %}selected{% endif %}>
                                        Primaria
                                    </option>
                                    <option value="Secundaria"
                                        {% if request.form.get('nivel') == 'Secundaria' %}selected{% endif %}>
                                        Secundaria
                                    </option>
                                </select>
                            </div>

                            <!-- ⭐ NUEVO: TURNO EN EL QUE TRABAJA -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Turno</label>
                                <select name="turno" class="form-select">
                                    <option value="Mañana"
                                        {% if request.form.get('turno', 'Mañana') == 'Mañana' %}selected{% endif %}>
                                        Mañana
                                    </option>
                                    <option value="Tarde"
                                        {% if request.form.get('turno') == 'Tarde' %}selected{% endif %}>
                                        Tarde
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Salario Base</label>
                                <input type="number"
                                       name="salario_base"
                                       class="form-control"
                                       step="0.01"
                                       min="0"
                                       value="{{ request.form.get('salario_base', '0') }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Estado</label>
                                <select name="estado" class="form-select">
                                    <option value="Activo" selected>Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Usuario para portal</label>
                                <input type="text"
                                       name="usuario"
                                       class="form-control"
                                       value="{{ request.form.get('usuario', '') }}"
                                       placeholder="Opcional">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contraseña para portal</label>
                                <input type="password"
                                       name="contrasena"
                                       class="form-control"
                                       autocomplete="new-password"
                                       placeholder="Opcional">
                            </div>

                        </div>

                        <div class="d-flex justify-content-between mt-3">
                            <a href="{{ url_for('personal.lista_profesores') }}"
                               class="btn btn-secondary">
                                Cancelar
                            </a>

                            <button type="submit" class="btn btn-success">
                                Guardar Profesor
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
