{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Nuevo Personal Administrativo</h4>
                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellidos *</label>
                                <input type="text"
                                       name="apellidos"
                                       class="form-control"
                                       value="{{ request.form.get('apellidos', '') }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombres *</label>
                                <input type="text"
                                       name="nombres"
                                       class="form-control"
                                       value="{{ request.form.get('nombres', '') }}"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">CI</label>
                                <input type="text"
                                       name="ci"
                                       class="form-control"
                                       value="{{ request.form.get('ci', '') }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Cargo *</label>
                                <input type="text"
                                       name="cargo"
                                       class="form-control"
                                       value="{{ request.form.get('cargo', '') }}"
                                       placeholder="Ejemplo: Secretaria, Contador, Portero"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Área</label>
                                <input type="text"
                                       name="area"
                                       class="form-control"
                                       value="{{ request.form.get('area', '') }}"
                                       placeholder="Ejemplo: Administración">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Salario Base</label>
                                <input type="number"
                                       name="salario_base"
                                       class="form-control"
                                       step="0.01"
                                       min="0"
                                       value="{{ request.form.get('salario_base', '0') }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Estado</label>
                                <select name="estado" class="form-select">
                                    <option value="Activo" selected>Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text"
                                       name="usuario"
                                       class="form-control"
                                       value="{{ request.form.get('usuario', '') }}"
                                       placeholder="Opcional">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password"
                                       name="contrasena"
                                       class="form-control"
                                       autocomplete="new-password"
                                       placeholder="Opcional">
                            </div>

                        </div>

                        <div class="d-flex justify-content-between mt-3">
                            <a href="{{ url_for('personal.lista_administrativos') }}"
                               class="btn btn-secondary">
                                Cancelar
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Guardar Administrativo
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
