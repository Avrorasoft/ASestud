<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Profesor - Colegio Dr. Antonio Vaca Díez</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 16px;
            margin: 0;
        }
        .portal-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
        }
        .portal-header {
            background: #203a43;
            color: #ffffff;
            padding: 30px 24px;
            text-align: center;
        }
        .portal-header h3 {
            font-weight: 800;
            margin: 0;
            font-size: 1.4rem;
        }
        .portal-body {
            padding: 30px 24px;
        }
        .btn-docente {
            background: #203a43;
            border-color: #203a43;
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-docente:hover {
            background: #2c5364;
            border-color: #2c5364;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="portal-card">
    <div class="portal-header">
        <div class="mb-2">
            <i class="fas fa-chalkboard-teacher fa-3x text-info"></i>
        </div>
        <h3>Portal del Personal Docente</h3>
        <p class="text-light mb-0 small">Plataforma de Gestión Académica</p>
    </div>

    <div class="portal-body">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show p-2 small mb-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('profesores_portal.login') }}">
            <div class="form-floating mb-3">
                <input type="text" name="usuario" class="form-control" id="inputUsuario" placeholder="Usuario" required autofocus>
                <label for="inputUsuario"><i class="fas fa-user me-2"></i>Usuario Docente</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" name="contrasena" class="form-control" id="inputPass" placeholder="Contraseña" required>
                <label for="inputPass"><i class="fas fa-lock me-2"></i>Contraseña</label>
            </div>

            <button type="submit" class="btn btn-docente mb-3">
                <i class="fas fa-sign-in-alt me-2"></i> Ingresar al Aula Virtual
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
