{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                Editar Datos del Estudiante
            </h4>

            <a href="{{ url_for('estudiantes.ver_estudiante', id=est.id) }}"
               class="btn btn-sm btn-light">
                Volver al Cardex
            </a>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <!-- =================================================== -->
                    <!-- C.I. IDENTIFICADOR PRINCIPAL -->
                    <!-- =================================================== -->

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            C.I. *
                        </label>

                        <input type="text"
                               name="ci"
                               class="form-control"
                               value="{{ est.ci }}"
                               required>
                    </div>

                    <!-- =================================================== -->
                    <!-- RUDE SOLO INFORMATIVO -->
                    <!-- =================================================== -->

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            RUDE (solo informativo)
                        </label>

                        <input type="text"
                               name="rude"
                               class="form-control"
                               value="{{ est.rude or '' }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Fecha de Nacimiento
                        </label>

                        <input type="date"
                               name="fecha_nacimiento"
                               class="form-control"
                               value="{{ est.fecha_nacimiento.strftime('%Y-%m-%d') if est.fecha_nacimiento else '' }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Apellidos *
                        </label>

                        <input type="text"
                               name="apellidos"
                               class="form-control"
                               value="{{ est.apellidos }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Nombres *
                        </label>

                        <input type="text"
                               name="nombres"
                               class="form-control"
                               value="{{ est.nombres }}"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Curso y Paralelo *
                        </label>

                        <!-- INPUT CON DATALIST: PERMITE SELECCIONAR O ESCRIBIR CUALQUIER PARALELO -->
                        <input list="lista_cursos"
                               name="curso"
                               id="curso"
                               class="form-control"
                               value="{{ est.curso }}"
                               placeholder="Seleccione o escriba un paralelo ej: 3ro Primaria A"
                               autocomplete="off"
                               required>

                        <datalist id="lista_cursos">
                            <!-- NIDITO 1, 2 Y 3 -->
                            <option value="Nidito 1">Nidito 1</option>
                            <option value="Nidito 2">Nidito 2</option>
                            <option value="Nidito 3">Nidito 3</option>

                            <!-- PRIMARIA -->
                            <option value="1ro Primaria">1ro Primaria</option>
                            <option value="2do Primaria">2do Primaria</option>
                            <option value="3ro Primaria">3ro Primaria</option>
                            <option value="4to Primaria">4to Primaria</option>
                            <option value="5to Primaria">5to Primaria</option>
                            <option value="6to Primaria">6to Primaria</option>

                            <!-- SECUNDARIA -->
                            <option value="1ro Secundaria">1ro Secundaria</option>
                            <option value="2do Secundaria">2do Secundaria</option>
                            <option value="3ro Secundaria">3ro Secundaria</option>
                            <option value="4to Secundaria">4to Secundaria</option>
                            <option value="5to Secundaria">5to Secundaria</option>
                            <option value="6to Secundaria">6to Secundaria</option>
                        </datalist>

                        <small class="text-muted">
                            Puede elegir de la lista o escribir un curso y paralelo nuevo (ej. 3ro B, Nidito 3 A).
                        </small>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Pensión Mensual (Bs.) *
                        </label>

                        <input type="number"
                               name="pension"
                               class="form-control"
                               step="0.01"
                               min="0"
                               value="{{ est.pension or 0 }}"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Estado
                        </label>

                        <select name="estado" class="form-select">
                            <option value="Activo"
                                {% if est.estado == 'Activo' %}selected{% endif %}>
                                Activo
                            </option>

                            <option value="Inactivo"
                                {% if est.estado == 'Inactivo' %}selected{% endif %}>
                                Inactivo
                            </option>

                            <option value="Archivado"
                                {% if est.estado == 'Archivado' %}selected{% endif %}>
                                Archivado
                            </option>
                        </select>
                    </div>

                </div>

                <hr>

                <h5>Dirección</h5>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Dirección
                        </label>

                        <input type="text"
                               name="direccion"
                               class="form-control"
                               value="{{ est.direccion or '' }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Zona
                        </label>

                        <input type="text"
                               name="zona"
                               class="form-control"
                               value="{{ est.zona or '' }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Ciudad
                        </label>

                        <input type="text"
                               name="ciudad"
                               class="form-control"
                               value="{{ est.ciudad or '' }}">
                    </div>

                </div>

                <div class="d-flex justify-content-between">

                    <a href="{{ url_for('estudiantes.ver_estudiante', id=est.id) }}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Guardar Cambios
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
