{% extends "base.html" %}
{% block title %}Registrar Pago{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-success text-white"><h5 class="mb-0">Nuevo Registro de Pago</h5></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Estudiante</label>
                        <select name="estudiante_id" class="form-select" required>
                            <option value="">Seleccionar...</option>
                            {% for e in estudiantes %}
                            <option value="{{ e.id }}">{{ e.apellidos }}, {{ e.nombres }} ({{ e.curso }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Mes</label>
                            <select name="mes" class="form-select" required>
                                <option value="Enero">Enero</option><option value="Febrero">Febrero</option>
                                <option value="Marzo">Marzo</option><option value="Abril">Abril</option>
                                <option value="Mayo">Mayo</option><option value="Junio">Junio</option>
                                <option value="Julio">Julio</option><option value="Agosto">Agosto</option>
                                <option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option>
                                <option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Año</label>
                            <input type="number" name="anio" class="form-control" value="2026" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Monto Total (Pensión)</label>
                            <input type="number" step="0.01" name="monto_total" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Descuento</label>
                            <input type="number" step="0.01" name="descuento" class="form-control" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Monto Pagado</label>
                            <input type="number" step="0.01" name="monto_pagado" class="form-control" required>
                        </div>
                    </div>
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar y Generar Recibo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
