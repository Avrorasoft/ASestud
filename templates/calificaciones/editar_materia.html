{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
    <h3 class="mb-4"><i class="bi bi-pencil"></i> Editar Materia</h3>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre de la Materia</label>
                    <input type="text" name="nombre" class="form-control" value="{{ materia.nombre }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Curso</label>
                    <select name="curso_id" class="form-select" required>
                        {% for c in cursos %}
                        <option value="{{ c }}" {% if c == materia.curso_id %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Profesor</label>
                    <select name="profesor_id" class="form-select" required>
                        {% for p in profesores %}
                        <option value="{{ p.id }}" {% if p.id == materia.profesor_id %}selected{% endif %}>{{ p.apellidos }}, {{ p.nombres }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Actualizar Materia</button>
                <a href="{{ url_for('calificaciones.lista_materias') }}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
